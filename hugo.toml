# publishDir = "docs"

baseURL = "https://qipconference.org/"
languageCode = "en"
title = "QIP Conference Website"

# Theme: github.com/IAQI/conference-theme, shared by the QCrypt, TQC and QIP
# websites (layouts, styles, schedule and accepted-papers templates, scripts).
# The version is pinned in go.mod / go.sum and downloaded at build time
# (Netlify needs Go for this: GO_VERSION in netlify.toml). Update it with
# `hugo mod get -u github.com/IAQI/conference-theme`.
# This site's own files in layouts/, assets/, i18n/ override the module's;
# this year's colours are in assets/style/theme-YEAR.scss.
[module]
  [[module.imports]]
    path = "github.com/IAQI/conference-theme"

# Params
enableEmoji = true
enableRobotsTXT = true
enableMissingTranslationPlaceholders = true

# No Google Analytics: the ID that was here (G-221GMGECQ6) belongs to the QCrypt
# website. To track QIP visits, add QIP's own ID under [services.googleAnalytics].

[params]
    title = "QIP Conference Website"
    date = "2027-01-10"
    currentYear = 2027
    description = "International Conference on Quantum Information Processing (QIP)"
    images = ["/images/social-share.jpg"]
    email = "info@qip2027.org"
    keywords = "event, quantum computation, communication, cryptography, QIP"
    copyright = "We :heart: quantum"
    copyright_link = "https://github.com/IAQI/qip-website"
    # cfpUrl = "/2024/call"
    # subscriptionUrl = ""
    appleTouchIcon = "/apple-touch-icon.png"
    favicon32 = "/favicon-32x32.png"
    favicon16 = "/favicon-16x16.png"
    manifest = "/site.webmanifest"
    # safariPinnedTab = "/safari-pinned-tab.svg"

[params.2027]
  city = "Singapore"
  timeanddate_cityid = 236
  themeColor = "#fdfdfd" # same as --primary (the white top bar) in assets/style/theme-2027.scss
  [params.2027.logos]
    jumbo = "/images/2027/qip2027-home-banner.jpg"
    header = "/images/2027/qip2027-logo.png"
    banner = "/images/2027/qip2027-banner-inside-pages.jpg"

[params.logos]
    footer = "/images/logos/netlify-color-accent.svg"
    footer_link = "https://www.netlify.com"

[server]
  [[server.redirects]]
      from = "/"
      to = "/2027/"
      status = 302
      force = true 

  # The shared menu structure (conference-theme docs/website-guide.md, "Menus"):
  # Home | Program | Schedule | Attend | Sponsors | Committees | About
  # Until the program is out, Call for Submissions and Registration are
  # top-level items (set in call.md and registration.md). Then uncomment
  # Program and Attend and move those pages under them.
  [[menu.2027]]
    name = "Home"
    weight = 10
    identifier = "home"
    pageRef = '/2027'

#  [[menu.2027]]
#    name = "Program"
#    weight = 20
#    identifier = "program"

#  [[menu.2027]]
#    name = "Attend"
#    weight = 30
#    identifier = "attend"

  [[menu.2027]]
    name = "Sponsors"
    weight = 40
    identifier = "sponsors"
    pageRef = "/2027/partners"

  [[menu.2027]]
    name = "Committees"
    weight = 50
    identifier = "committees"
    pageRef = "/2027/team"

  [[menu.2027]]
    name = "About"
    weight = 60
    identifier = "about"

[languages]
[languages.en]
    weight = 1
    languageName = "us"

[taxonomies]
    tag = "tags"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[privacy]
    [privacy.disqus]
        disable = true
    [privacy.googleAnalytics]
        anonymizeIP = false
        disable = false
        respectDoNotTrack = false
        useSessionStorage = false
    [privacy.instagram]
        disable = true
        simple = false
    [privacy.twitter]
        disable = false
        enableDNT = false
        simple = false
    [privacy.vimeo]
        disable = true
        simple = false
    [privacy.youtube]
        disable = true
        privacyEnhanced = true
